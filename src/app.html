<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Morse lernen mit der Koch-Methode und Farnsworth-Abständen" />
		<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Morse" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Set the theme before the first paint so there is no flash of the wrong one.
			(function () {
				var theme = 'system';
				try {
					var raw = localStorage.getItem('morse-trainer');
					var saved = raw && JSON.parse(raw).settings.theme;
					if (saved === 'light' || saved === 'dark') theme = saved;
				} catch (e) {}
				if (theme === 'system') {
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<style>
			/* Background before app.css loads */
			html { background: #f6f6f3; }
			html[data-theme='dark'] { background: #111315; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
